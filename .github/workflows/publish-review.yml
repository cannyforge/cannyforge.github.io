name: Publish review PR

# publish.py --branch pushes rendered article + manifest/feed changes to
# publish/<slug>. This opens a PR for review the first time that branch is
# pushed; re-pushing after edits updates the same PR's diff automatically —
# GitHub does that on its own, no extra step needed here.

on:
  push:
    branches:
      - 'publish/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-review-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open PR if one doesn't already exist for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          existing=$(gh pr list --head "$BRANCH" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "PR already open for $BRANCH — diff updates automatically on push. Nothing to do."
            exit 0
          fi

          slug="${BRANCH#publish/}"
          title="Publish: $slug"
          body="Merge to publish — GitHub Pages deploys automatically on merge to \`main\`."

          if [ -f manifest.json ]; then
            entry_title=$(jq -r --arg slug "$slug" '[.[] | select(.slug == $slug)][0].title // empty' manifest.json)
            entry_desc=$(jq -r --arg slug "$slug" '[.[] | select(.slug == $slug)][0].description // empty' manifest.json)
            if [ -n "$entry_title" ]; then
              title="Publish: $entry_title"
              printf -v body '%s\n\n---\nSlug: `%s` · Branch: `%s`\nMerge this PR to publish — GitHub Pages deploys automatically on merge to `main`.' \
                "$entry_desc" "$slug" "$BRANCH"
            fi
          fi

          gh pr create --title "$title" --body "$body" --base main --head "$BRANCH"
